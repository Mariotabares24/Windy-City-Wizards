<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Cosmic Together">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1312"/>
      <stop offset="0.55" stop-color="#101514"/>
      <stop offset="1" stop-color="#161d1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9a679" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e9a679" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9dc5a6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#9dc5a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- soft drifting glow behind the orbit -->
  <circle cx="930" cy="170" r="220" fill="url(#glow)">
    <animate attributeName="r" values="200;240;200" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkling field -->
  <g fill="#f3f0e7">
    <circle cx="120" cy="70" r="1.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="250" r="1.3"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="200" r="1.1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.7s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="50" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="90" r="1.5"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.9s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="290" r="1.2"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="4.4s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="300" r="1.2"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="5s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orbit system on the right -->
  <g transform="translate(930 170)">
    <circle cx="0" cy="0" r="150" fill="url(#greenGlow)"/>
    <g stroke="#e9a679" stroke-opacity="0.28" fill="none">
      <ellipse rx="150" ry="60"/>
      <ellipse rx="110" ry="110" stroke-opacity="0.16"/>
    </g>
    <!-- copper planet on the flat orbit -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/>
      <circle cx="150" cy="0" r="9" fill="#e9a679"/>
    </g>
    <!-- green moon on the round orbit, counter-spin -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="9s" repeatCount="indefinite"/>
      <circle cx="0" cy="110" r="6" fill="#9dc5a6"/>
    </g>
    <!-- core -->
    <circle cx="0" cy="0" r="16" fill="#f3f0e7">
      <animate attributeName="r" values="15;17;15" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="90" y="175" font-size="72" fill="#f3f0e7" letter-spacing="-1">cosmic<tspan fill="#e9a679" font-style="italic"> together</tspan></text>
    <text x="94" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#c4bab3" letter-spacing="0.5">Considered shopping, with your people.</text>
    <text x="94" y="262" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8a938b" letter-spacing="2">WINDY CITY WIZARDS</text>
  </g>
</svg>
